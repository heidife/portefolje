<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heidi F. Enger Otone portefølje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: luftig kortrutenett i tre kolonner, faner øverst, detaljer i dialog. Stil fra CV: svart/hvitt, Inter Medium + IBM Plex Mono */
:root{
  --paper:#FFFFFF;
  --ink:#0A0A0A;
  --muted:#6B6B6B;
  --line:#E6E6E6;
  --tint:#F4F4F4;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0B0B0B;--ink:#F2F2F2;--muted:#9A9A9A;--line:#262626;--tint:#171717;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#0B0B0B;--ink:#F2F2F2;--muted:#9A9A9A;--line:#262626;--tint:#171717;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media (max-width:520px){.wrap{padding:0 18px}}
.mono{font-family:var(--mono);font-size:13px;line-height:1.4}

/* Topp */
header{padding:72px 0 56px;display:grid;gap:28px}
.name{font-weight:500;font-size:clamp(44px,8vw,96px);line-height:1.04;letter-spacing:-.03em;margin:0;max-width:10ch;text-wrap:balance}
.intro{font-weight:500;font-size:clamp(18px,1.8vw,21px);line-height:1.4;letter-spacing:-.005em;margin:0;max-width:44ch}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0;color:var(--muted)}
.meta-row a{text-decoration:none}
.meta-row a:hover{text-decoration:underline;text-underline-offset:3px}

/* Faner */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:40px;overflow-x:auto}
.tab{all:unset;cursor:pointer;font-family:var(--sans);font-weight:500;font-size:15px;padding:0 0 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

/* Kort */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:40px}}
.card{display:grid;gap:12px;align-content:start;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.card .media{aspect-ratio:4/3;overflow:hidden;background:var(--tint)}
.card .media img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:no-preference){.card .media img{transition:transform .5s ease}.card:hover .media img{transform:scale(1.03)}}
.card .kicker{color:var(--muted);margin:4px 0 0}
.card h3{font-weight:500;font-size:19px;line-height:1.25;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card .role{color:var(--muted);font-size:15px;margin:0}
.card:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;height:100%}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}

.panel[hidden]{display:none}

footer{padding:96px 0 48px;color:var(--muted)}

/* Dialog */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(1100px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:32px;display:grid;gap:24px}
@media (max-width:520px){.dlg{padding:20px}}
.dlg-head{display:flex;justify-content:space-between;gap:16px;align-items:start}
.dlg-head h2{font-weight:500;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;line-height:1.1;margin:6px 0 0}
.dlg-head p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.close{all:unset;cursor:pointer;font-family:var(--mono);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;flex:none}
.close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.photos{columns:3 260px;column-gap:10px}
.photos img{width:100%;height:auto;display:block;margin:0 0 10px;break-inside:avoid}
.list{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
@media (max-width:820px){.list{grid-template-columns:repeat(2,1fr)}}
.list a{display:grid;gap:8px;text-decoration:none}
.list a img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.list a span{font-weight:500;line-height:1.3}
.list a:hover span{text-decoration:underline;text-underline-offset:3px}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1 class="name" data-edit="name">Heidi F. Enger Otone</h1>
  <p class="intro" data-edit="intro">Jeg finner historiene, intervjuer menneskene, skriver tekstene og tar bildene. Her er et utvalg av arbeidet mitt.</p>
  <p class="meta-row mono"><span data-edit="tagline">Innhold og kommunikasjon</span><a href="mailto:heidi.enger@gmail.com">heidi.enger@gmail.com</a><span>Oslo</span></p>
</header>

<nav class="tabs" role="tablist" aria-label="Velg visning">
  <button class="tab" role="tab" id="tab-tekster" aria-controls="tekster" aria-selected="true">Tekster</button>
  <button class="tab" role="tab" id="tab-foto" aria-controls="foto" aria-selected="false" tabindex="-1">Foto</button>
  <button class="tab" role="tab" id="tab-alt" aria-controls="alt" aria-selected="false" tabindex="-1">Alt</button>
</nav>

<section class="panel" id="tekster" role="tabpanel" aria-labelledby="tab-tekster">
  <div class="grid" data-slot="texts"></div>
</section>
<section class="panel" id="foto" role="tabpanel" aria-labelledby="tab-foto" hidden>
  <div class="grid" data-slot="photos"></div>
</section>
<section class="panel" id="alt" role="tabpanel" aria-labelledby="tab-alt" hidden>
  <div class="grid" data-slot="all"></div>
</section>

<footer class="mono">Heidi F. Enger Otone · Oslo</footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg">
  <div class="dlg-head"><div><p class="mono" id="dlg-kicker" style="margin:0;color:var(--muted)"></p><h2 id="dlg-title"></h2><p id="dlg-text"></p></div><button class="close" type="button" id="dlg-close">Lukk</button></div>
  <div id="dlg-body"></div>
</div></dialog>

<script>
var SB="https://www.sparebank1.no/nb/bank/";
var SERIES=[
  {id:"ung",title:"Forsikringene du trenger som ung",img:"img/c-ung.jpg",year:"2024",url:SB+"om-oss/nyheter/forsikringene-du-trenger-som-ung.html"},
  {id:"etablering",title:"Forsikringene du trenger i etableringsfasen",img:"img/c-etablering.jpg",year:"2022",url:SB+"om-oss/nyheter/forsikringene-du-trenger-i-etableringsfasen.html"},
  {id:"familien",title:"Forsikringene familien trenger",img:"img/c-familien.jpg",year:"2024",url:SB+"om-oss/nyheter/forsikringene-familien-trenger-.html"},
  {id:"barna",title:"Forsikringene du trenger etter barna har flyttet ut",img:"img/c-barna.jpg",year:"2022",url:SB+"om-oss/nyheter/forsikringene-du-trenger-etter-barna-har-flyttet-ut.html"}
];
var WORKS={
  vann:{kind:"text",kicker:"Kundehistorie · Fremtind · 2024",title:"Klok av skade: sikrer seg mot vannlekkasje",role:"Fant casepersoner, intervju, tekst og foto",img:"img/vannlekkasje.jpg",
        url:SB+"privat/forsikring/kundehistorier/sikrer-seg-mot-vannlekkasje-klok-av-skade.html"},
  barn:{kind:"text",kicker:"Kundehistorie · Fremtind · 2025",title:"Barneforsikring som trygghet når livet tar en ny vending",role:"Fant casepersoner, intervju og tekst",img:"img/c-barneforsikring.jpg",
        url:SB+"om-oss/nyheter/barneforsikring-okonomisk-trygghet-firebarnsfamilien.html"},
  serie:{kind:"series",kicker:"Artikkelserie · Fremtind · 2022–2024",title:"Livsløpserien: forsikringene du trenger gjennom livet",role:"Idé, konsept og tekst · 4 artikler",
        text:"En serie som tar utgangspunkt i hvor leseren er i livet, ikke i produktene: hva du trenger nå, og hva du kan vente med."},
  f_vann:{kind:"photo",kicker:"Reportasje · Fremtind · 2024",title:"Kundehistorie: vannlekkasje",role:"Portrett og situasjonsbilder",img:"img/foto-portrett.jpg",
        photos:["foto-portrett","vannlekkasje","foto-paret","foto-doren"]},
  f_nyd:{kind:"photo",kicker:"Reportasje",title:"Norsk Yrkesdykkerskole",role:"En dag med dykkerelevene",img:"img/nyd-1.jpg",
        photos:["nyd-1","nyd-2","nyd-3","nyd-4","nyd-5","nyd-6","nyd-7","nyd-8","nyd-9"]},
  f_vespa:{kind:"photo",kicker:"Arrangement",title:"Vespa: «Do you Vespa?»",role:"Stemning, folk og detaljer",img:"img/vespa-1.jpg",
        photos:["vespa-1","vespa-2","vespa-3","vespa-4","vespa-5","vespa-6"]},
  f_oras:{kind:"photo",kicker:"Produkt og kampanje",title:"Oras",role:"Kjøkkenkraner med og uten modell",img:"img/oras-1.jpg",
        photos:["oras-1","oras-2","oras-3","oras-4"]}
};
SERIES.forEach(function(s,i){
  WORKS["s_"+s.id]={kind:"text",kicker:"Livsløpserien "+(i+1)+"/4 · Fremtind · "+s.year,title:s.title,role:"Idé og tekst",img:s.img,url:s.url};
});
var SLOTS={
  texts:["vann","barn","s_ung","s_etablering","s_familien","s_barna"],
  photos:["f_vann","f_nyd","f_vespa","f_oras"],
  all:["vann","barn","serie","f_vann","f_nyd","f_vespa","f_oras"]
};

function el(tag,attrs,html){var e=document.createElement(tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function card(key){
  var w=WORKS[key], c;
  if(w.kind==="text"){ c=el("a",{class:"card",href:w.url,target:"_blank",rel:"noopener"}); }
  else { c=el("button",{class:"card",type:"button","data-open":key}); }
  var media = w.kind==="series"
    ? '<div class="media"><div class="mosaic">'+SERIES.map(function(s){return '<img src="'+s.img+'" alt="" loading="lazy">';}).join("")+'</div></div>'
    : '<div class="media"><img src="'+w.img+'" alt="" loading="lazy"></div>';
  c.innerHTML = media
    + '<p class="kicker mono" data-edit="'+key+'-kicker">'+esc(w.kicker)+'</p>'
    + '<h3 data-edit="'+key+'-title">'+esc(w.title)+'</h3>'
    + '<p class="role" data-edit="'+key+'-role">'+esc(w.role)+'</p>';
  return c;
}
document.querySelectorAll("[data-slot]").forEach(function(g){
  SLOTS[g.dataset.slot].forEach(function(k){ g.appendChild(card(k)); });
});

/* Faner */
var tabs=[].slice.call(document.querySelectorAll(".tab"));
function show(id,focus){
  tabs.forEach(function(t){var on=t.getAttribute("aria-controls")===id;t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1;if(on&&focus)t.focus();});
  document.querySelectorAll(".panel").forEach(function(p){p.hidden=p.id!==id;});
}
tabs.forEach(function(t,i){
  t.addEventListener("click",function(){show(t.getAttribute("aria-controls"));try{history.replaceState(null,"","#"+t.getAttribute("aria-controls"));}catch(e){}});
  t.addEventListener("keydown",function(e){
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
    var n=tabs[(i+(e.key==="ArrowRight"?1:tabs.length-1))%tabs.length];show(n.getAttribute("aria-controls"),true);
  });
});
function fromHash(){var h=(location.hash||"").slice(1);if(["tekster","foto","alt"].indexOf(h)>-1)show(h);}
fromHash();window.addEventListener("hashchange",fromHash);

/* Dialog */
var dlg=document.getElementById("dlg");
function openWork(key){
  var w=WORKS[key];
  document.getElementById("dlg-kicker").textContent=w.kicker;
  document.getElementById("dlg-title").textContent=w.title;
  document.getElementById("dlg-text").textContent=w.text||w.role;
  var b=document.getElementById("dlg-body");
  if(w.kind==="series"){
    b.innerHTML='<div class="list">'+SERIES.map(function(s,i){return '<a href="'+s.url+'" target="_blank" rel="noopener"><img src="'+s.img+'" alt=""><span class="mono" style="color:var(--muted);font-weight:400">'+(i+1)+'/4 · '+s.year+'</span><span>'+esc(s.title)+' ↗</span></a>';}).join("")+'</div>';
  } else {
    b.innerHTML='<div class="photos">'+w.photos.map(function(p){return '<img src="img/'+p+'.jpg" alt="Foto fra '+esc(w.title)+'" loading="lazy">';}).join("")+'</div><p class="mono" style="color:var(--muted);margin:0">Foto: Heidi F. Enger Otone</p>';
  }
  try{dlg.showModal();}catch(e){dlg.setAttribute("open","");}
}
document.addEventListener("click",function(e){
  var o=e.target.closest("[data-open]"); if(o){openWork(o.dataset.open);}
});
document.getElementById("dlg-close").addEventListener("click",function(){dlg.close();});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});

</script>
</body>
</html>
